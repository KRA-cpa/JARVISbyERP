<!DOCTYPE html>
<html>
<head>
    <title>API Connection Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { margin: 5px; padding: 10px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 API Connection Debug Test</h1>
    <p><strong>Apps Script URL:</strong> https://script.google.com/macros/s/AKfycbyoHL6D9whNrh2lMujkbS576tA0AMLvXlOJFi8eKb0Lxwl5Hdl7MHiEcBWNPQDEI6zqYA/exec</p>

    <div id="results"></div>

    <button onclick="testGET()">1. Test GET Request</button>
    <button onclick="testPOST()">2. Test POST Request</button>
    <button onclick="testCORS()">3. Test CORS Headers</button>
    <button onclick="testFromVercel()">4. Test Like Frontend</button>
    <button onclick="clearResults()">Clear Results</button>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyoHL6D9whNrh2lMujkbS576tA0AMLvXlOJFi8eKb0Lxwl5Hdl7MHiEcBWNPQDEI6zqYA/exec';
        const resultsDiv = document.getElementById('results');

        function addResult(title, content, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<strong>${title}</strong><br><pre>${content}</pre>`;
            resultsDiv.appendChild(div);
            div.scrollIntoView({ behavior: 'smooth' });
        }

        function clearResults() {
            resultsDiv.innerHTML = '';
        }

        async function testGET() {
            addResult('🧪 Testing GET Request', 'Starting GET request test...');

            try {
                const start = Date.now();
                const response = await fetch(`${API_URL}?action=ping`);
                const duration = Date.now() - start;

                addResult('📊 GET Response Info',
                    `Status: ${response.status}\n` +
                    `OK: ${response.ok}\n` +
                    `Status Text: ${response.statusText}\n` +
                    `Duration: ${duration}ms\n` +
                    `Headers: ${JSON.stringify([...response.headers.entries()], null, 2)}`
                );

                if (response.ok) {
                    const text = await response.text();
                    try {
                        const json = JSON.parse(text);
                        addResult('✅ GET Request Successful', JSON.stringify(json, null, 2), 'success');
                    } catch (e) {
                        addResult('⚠️ GET Response Not JSON', `Raw response: ${text}`, 'error');
                    }
                } else {
                    addResult('❌ GET Request Failed', `HTTP ${response.status}: ${response.statusText}`, 'error');
                }
            } catch (error) {
                addResult('💥 GET Request Error', `${error.name}: ${error.message}`, 'error');
            }
        }

        async function testPOST() {
            addResult('🧪 Testing POST Request', 'Starting POST request test...');

            try {
                const start = Date.now();
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'ping',
                        timestamp: new Date().toISOString()
                    })
                });
                const duration = Date.now() - start;

                addResult('📊 POST Response Info',
                    `Status: ${response.status}\n` +
                    `OK: ${response.ok}\n` +
                    `Status Text: ${response.statusText}\n` +
                    `Duration: ${duration}ms\n` +
                    `Headers: ${JSON.stringify([...response.headers.entries()], null, 2)}`
                );

                if (response.ok) {
                    const text = await response.text();
                    try {
                        const json = JSON.parse(text);
                        addResult('✅ POST Request Successful', JSON.stringify(json, null, 2), 'success');
                    } catch (e) {
                        addResult('⚠️ POST Response Not JSON', `Raw response: ${text}`, 'error');
                    }
                } else {
                    addResult('❌ POST Request Failed', `HTTP ${response.status}: ${response.statusText}`, 'error');
                }
            } catch (error) {
                addResult('💥 POST Request Error', `${error.name}: ${error.message}`, 'error');
            }
        }

        async function testCORS() {
            addResult('🧪 Testing CORS (OPTIONS)', 'Starting CORS preflight test...');

            try {
                const response = await fetch(API_URL, {
                    method: 'OPTIONS',
                    headers: {
                        'Access-Control-Request-Method': 'POST',
                        'Access-Control-Request-Headers': 'Content-Type'
                    }
                });

                addResult('📊 CORS Response Info',
                    `Status: ${response.status}\n` +
                    `OK: ${response.ok}\n` +
                    `Headers: ${JSON.stringify([...response.headers.entries()], null, 2)}`
                );

                if (response.ok) {
                    addResult('✅ CORS Request Successful', 'OPTIONS request completed successfully', 'success');
                } else {
                    addResult('❌ CORS Request Failed', `HTTP ${response.status}: ${response.statusText}`, 'error');
                }
            } catch (error) {
                addResult('💥 CORS Request Error', `${error.name}: ${error.message}`, 'error');
            }
        }

        async function testFromVercel() {
            addResult('🧪 Testing Like Frontend', 'Simulating exact frontend API call...');

            // This exactly mimics what the frontend checkAPIConnection does
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'ping',
                        timestamp: new Date().toISOString()
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                const result = {
                    connected: true,
                    status: 'healthy',
                    responseTime: data.responseTime || 0,
                    serverTime: data.serverTime,
                    version: data.version || 'unknown'
                };

                addResult('✅ Frontend Simulation Successful', JSON.stringify(result, null, 2), 'success');

            } catch (error) {
                const result = {
                    connected: false,
                    status: 'error',
                    error: error.message,
                    responseTime: null
                };

                addResult('❌ Frontend Simulation Failed', JSON.stringify(result, null, 2), 'error');
            }
        }

        // Auto-run basic test on page load
        window.onload = function() {
            addResult('🚀 Debug Test Page Loaded', 'Click buttons above to run tests. Start with "Test GET Request".');
        };
    </script>
</body>
</html>
